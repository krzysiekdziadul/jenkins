name: TestComplete install check

on:
  workflow_dispatch:
    inputs:
      testcomplete_url:
        required: false
        default: "https://downloads.smartbear.com/TestComplete1584SLM.exe"
        type: string
      testexecute_url:
        required: false
        default: "https://downloads.smartbear.com/TestExecute1584SLM.exe"
        type: string

jobs:
  install-and-open:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download TestComplete
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "${{ inputs.testcomplete_url }}" -OutFile ".\TC.exe"
          Get-Item .\TC.exe | Format-List Name, Length

      - name: Install .NET Desktop Runtime 8
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.27/windowsdesktop-runtime-8.0.27-win-x64.exe" -OutFile ".
untime.exe"
          $r = Start-Process -FilePath ".
untime.exe" -ArgumentList "/install","/quiet","/norestart" -Wait -PassThru
          Write-Host "Runtime installer exit code: $($r.ExitCode)"

      - name: Install TestComplete (silent)
        shell: cmd
        run: .\TC.exe -SilentInstall

      - name: Locate TestComplete.exe
        shell: powershell
        run: |
          $exe = Get-ChildItem "C:\Program Files (x86)\SmartBear", "C:\Program Files\SmartBear" -Recurse -Filter TestComplete.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "TestComplete.exe not found after install" }
          Write-Host "Found: $($exe.FullName)"
          "TC_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Open TestComplete (with access key)
        continue-on-error: true
        shell: powershell
        env:
          TC_KEY: "a_9fc9dc45-f5c7-42bb-be30-510a0c13d507"
        run: |
          $p = Start-Process -FilePath $env:TC_EXE -ArgumentList "/AccessKey:$env:TC_KEY" -PassThru
          Start-Sleep -Seconds 60
          $p.Refresh()
          if ($p.HasExited) { throw "TestComplete exited with code $($p.ExitCode)" }
          Write-Host "TestComplete is running. PID=$($p.Id), MainWindowTitle='$($p.MainWindowTitle)'"

      - name: Screenshot
        if: always()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screen.png")

      - name: Event Log (application errors)
        if: always()
        shell: powershell
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2} -MaxEvents 15 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Message

      - name: Install TestExecute
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "${{ inputs.testexecute_url }}" -OutFile ".\TE.exe"
          cmd /c ".\TE.exe -SilentInstall"
          $te = Get-ChildItem "C:\Program Files (x86)\SmartBear", "C:\Program Files\SmartBear" -Recurse -Filter TestExecute.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $te) { throw "TestExecute.exe not found after install" }
          Write-Host "Found: $($te.FullName)"
          "TE_EXE=$($te.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Open TestExecute with access key
        continue-on-error: true
        shell: powershell
        env:
          TC_KEY: "WKLEJ_TUTAJ_KLUCZ"
        run: |
          $p = Start-Process -FilePath $env:TE_EXE -ArgumentList "/AccessKey:$env:TC_KEY" -PassThru
          Start-Sleep -Seconds 60
          $p.Refresh()
          if ($p.HasExited) { throw "TestExecute exited with code $($p.ExitCode)" }
          Write-Host "TestExecute is running. PID=$($p.Id)"

      - name: Screenshot 2
        if: always()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screen2.png")

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screen*.png
