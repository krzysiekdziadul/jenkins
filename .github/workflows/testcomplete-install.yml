name: TestComplete install check

on:
  workflow_dispatch:
    inputs:
      testcomplete_url:
        required: false
        default: "https://downloads.smartbear.com/TestComplete1584SLM.exe"
        type: string

jobs:
  install-and-open:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download TestComplete
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "${{ inputs.testcomplete_url }}" -OutFile ".\TC.exe"
          Get-Item .\TC.exe | Format-List Name, Length

      - name: Install .NET Desktop Runtime 8
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.27/windowsdesktop-runtime-8.0.27-win-x64.exe" -OutFile ".\runtime.exe"
          $r = Start-Process -FilePath ".\runtime.exe" -ArgumentList "/install","/quiet","/norestart" -Wait -PassThru
          Write-Host "Runtime installer exit code: $($r.ExitCode)"

      - name: Install TestComplete (silent)
        shell: cmd
        run: .\TC.exe -SilentInstall

      - name: Locate TestComplete.exe
        shell: powershell
        run: |
          $exe = Get-ChildItem "C:\Program Files (x86)\SmartBear", "C:\Program Files\SmartBear" -Recurse -Filter TestComplete.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "TestComplete.exe not found after install" }
          Write-Host "Found: $($exe.FullName)"
          "TC_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Enable crash dumps
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force C:\dumps | Out-Null
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $k -Force | Out-Null
          Set-ItemProperty -Path $k -Name DumpFolder -Value "C:\dumps"
          Set-ItemProperty -Path $k -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $k -Name DumpCount -Value 5 -Type DWord

      - name: Open TestComplete via cmd start
        continue-on-error: true
        shell: cmd
        env:
          TC_KEY: "a_9fc9dc45-f5c7-42bb-be30-510a0c13d507"
        run: |
          for %%F in ("%TC_EXE%") do set "TC_DIR=%%~dpF"
          echo Working dir: %TC_DIR%
          start "" /D "%TC_DIR%" "%TC_EXE%" /AccessKey:%TC_KEY%
          timeout /t 30 /nobreak >nul
          tasklist /FI "IMAGENAME eq TestComplete.exe"

      - name: Check TestComplete is running
        shell: powershell
        run: |
          $p = Get-Process TestComplete -ErrorAction SilentlyContinue
          if (-not $p) { throw "TestComplete is not running (crashed after start)" }
          Write-Host "TestComplete is running. PID=$($p.Id)"

      - name: Wait 60 seconds for TestComplete to load
        shell: powershell
        run: Start-Sleep -Seconds 60

      - name: Screenshot
        if: always()
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screen.png")

      - name: Event Log (application errors)
        if: always()
        shell: powershell
        run: |
          Write-Host "--- dotnet runtimes ---"
          dotnet --list-runtimes
          Write-Host "--- application errors ---"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2} -MaxEvents 15 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Message

      - name: Collect dumps and TestComplete logs
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force collected | Out-Null
          if (Test-Path C:\dumps) { Copy-Item C:\dumps collected\dumps -Recurse -Force }
          foreach ($d in "$env:LOCALAPPDATA\SmartBear", "$env:APPDATA\SmartBear", "$env:ProgramData\SmartBear") {
            if (Test-Path $d) { Copy-Item $d ("collected\" + ($d -replace '[:\]','_')) -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem collected -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload dumps and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dumps-and-logs
          path: collected
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screen*.png
