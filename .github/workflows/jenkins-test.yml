name: Jenkins TestComplete

on:
  workflow_dispatch:
    inputs:
      testcomplete_url:
        required: false
        default: "https://downloads.smartbear.com/TestComplete1584SLM.exe"
        type: string

jobs:
  run-tests:
    runs-on: self-hosted
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh   # jeśli nie masz PowerShell 7, zmień na: powershell
    env:
      JOB: "TestComplete%20QA%20tc-ui-automation%20(bareAgent)"
      JURL: "https://qa-automation.dev.testcomplete.com"
      JU: "krzysiekdziadul"
      JT: "1191d1776ef14ee3a03e9ebce05d21b662"
      JOB_TOKEN: "9#Jtqt8b!CdCp%!$"
      TESTCOMPLETE_URL: ${{ inputs.testcomplete_url }}
    steps:
      - name: Trigger Jenkins
        run: |
          $ErrorActionPreference = 'Stop'
          $cred = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:JU}:${env:JT}"))
          $headers = @{ Authorization = "Basic $cred" }
          $body = @{ token = $env:JOB_TOKEN; TESTCOMPLETE_URL = $env:TESTCOMPLETE_URL }
          $r = Invoke-WebRequest -Method Post -Headers $headers -Body $body -UseBasicParsing `
            -Uri "$env:JURL/job/$env:JOB/buildWithParameters"
          $queue = $r.Headers['Location'] | Select-Object -First 1
          if (-not $queue) { throw "No queue URL" }
          "QUEUE_URL=$queue" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Wait for build to start
        run: |
          $cred = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:JU}:${env:JT}"))
          $headers = @{ Authorization = "Basic $cred" }
          $build = $null
          for ($i = 0; $i -lt 360 -and -not $build; $i++) {
            $q = Invoke-RestMethod -Headers $headers -Uri "$($env:QUEUE_URL)api/json"
            $build = $q.executable.url
            if (-not $build) { Start-Sleep -Seconds 10 }
          }
          if (-not $build) { throw "Build did not start" }
          "BUILD_URL=$build" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "Jenkins build: $build" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Wait for result
        run: |
          $cred = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:JU}:${env:JT}"))
          $headers = @{ Authorization = "Basic $cred" }
          while ($true) {
            $b = Invoke-RestMethod -Headers $headers -Uri "$($env:BUILD_URL)api/json"
            $status = if ($b.building) { "RUNNING" } elseif ($b.result) { $b.result } else { "UNKNOWN" }
            Write-Host $status
            if ($status -ne "RUNNING") { break }
            Start-Sleep -Seconds 60
          }
          if ($status -ne "SUCCESS") { exit 1 }

      - name: Cancel Jenkins build
        if: cancelled()
        run: |
          if ($env:BUILD_URL) {
            $cred = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:JU}:${env:JT}"))
            try { Invoke-RestMethod -Method Post -Headers @{ Authorization = "Basic $cred" } -Uri "$($env:BUILD_URL)stop" } catch {}
          }
