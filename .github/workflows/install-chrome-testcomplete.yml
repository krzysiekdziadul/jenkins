name: Install Chrome and TestComplete

on:
  workflow_dispatch:
    inputs:
      testcomplete_url:
        required: false
        default: "https://downloads.smartbear.com/TestComplete1584SLM.exe"
        type: string

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - name: Ensure Chrome is installed
        run: |
          $paths = "C:\Program Files\Google\Chrome\Application\chrome.exe", "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          $chrome = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) {
            Write-Host "Chrome not found, installing..."
            choco install googlechrome -y --no-progress
            $chrome = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $chrome) { throw "Chrome not found after install" }
          Write-Host "Chrome: $chrome  ($((Get-Item $chrome).VersionInfo.ProductVersion))"

      - name: Disable Chrome updates, first-run and promo dialogs (policies)
        run: |
          $c = "HKLM:\SOFTWARE\Policies\Google\Chrome"
          New-Item -Path $c -Force | Out-Null
          $dword = @{
            DefaultBrowserSettingEnabled = 0
            MetricsReportingEnabled      = 0
            BrowserSignin                = 0
            SyncDisabled                 = 1
            PromotionalTabsEnabled       = 0
            BackgroundModeEnabled        = 0
            ChromeCleanupEnabled         = 0
            PasswordManagerEnabled       = 0
          }
          foreach ($k in $dword.Keys) { Set-ItemProperty -Path $c -Name $k -Value $dword[$k] -Type DWord }
          $u = "HKLM:\SOFTWARE\Policies\Google\Update"
          New-Item -Path $u -Force | Out-Null
          Set-ItemProperty -Path $u -Name AutoUpdateCheckPeriodMinutes -Value 0 -Type DWord
          Set-ItemProperty -Path $u -Name UpdateDefault -Value 0 -Type DWord
          Set-ItemProperty -Path $u -Name "Update{8A69D345-D564-463C-AFF1-A69D9E530F96}" -Value 0 -Type DWord
          Get-Service gupdate, gupdatem -ErrorAction SilentlyContinue | ForEach-Object { Stop-Service $_ -Force -ErrorAction SilentlyContinue; Set-Service $_.Name -StartupType Disabled -ErrorAction SilentlyContinue }
          Get-ScheduledTask -TaskName "GoogleUpdate*" -ErrorAction SilentlyContinue | Disable-ScheduledTask -ErrorAction SilentlyContinue | Out-Null

      - name: Install .NET Desktop Runtime 8
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.27/windowsdesktop-runtime-8.0.27-win-x64.exe" -OutFile ".\runtime.exe"
          $r = Start-Process -FilePath ".\runtime.exe" -ArgumentList "/install","/quiet","/norestart" -Wait -PassThru
          Write-Host "Runtime installer exit code: $($r.ExitCode)"

      - name: Download TestComplete
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "${{ inputs.testcomplete_url }}" -OutFile ".\TC.exe"
          Get-Item .\TC.exe | Format-List Name, Length

      - name: Install TestComplete (silent)
        run: |
          $p = Start-Process -FilePath ".\TC.exe" -ArgumentList "-SilentInstall" -PassThru
          if (-not $p.WaitForExit(30 * 60 * 1000)) { $p.Kill(); throw "TestComplete installer did not finish in 30 minutes" }
          Write-Host "TestComplete installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "TestComplete installation failed (exit code $($p.ExitCode))" }

      - name: Verify installation (nothing is started)
        run: |
          $all = @(Get-ChildItem "C:\Program Files (x86)\SmartBear", "C:\Program Files\SmartBear" -Recurse -Filter TestComplete.exe -ErrorAction SilentlyContinue)
          Write-Host "All TestComplete.exe found:"
          $all | ForEach-Object { Write-Host "  $($_.FullName)  ($($_.VersionInfo.FileVersion))" }
          $exe = $all | Where-Object { $_.FullName -like '*\x64\Bin\*' } | Select-Object -First 1
          if (-not $exe) { $exe = $all | Select-Object -First 1 }
          if (-not $exe) { throw "TestComplete.exe not found after install" }
          Write-Host "TestComplete (use this one - x64 preferred): $($exe.FullName)"
          "TC_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe", "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "Chrome: $chrome"
          Get-Process chrome, TestComplete -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "WARNING: running process $($_.Name)" }

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Robot Framework and FlaUILibrary
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          robot --version

      - name: Run test TC_T1018 (create new project by entry point)
        env:
          TC_KEY: "a_9fc9dc45-f5c7-42bb-be30-510a0c13d507"
        run: |
          # make "TestComplete" resolve to the x64 binary chosen in the verify step
          $env:PATH = "$(Split-Path $env:TC_EXE);$env:PATH"
          Write-Host "TestComplete used by Robot: $env:TC_EXE"
          robot -v JENKINS_WORKSPACE:"$env:GITHUB_WORKSPACE" -v TC_SLM_KEY:$env:TC_KEY --outputdir results tests/create_new_project/TC_T1018_create_new_project_by_entry-point.robot

      - name: Screenshot of the desktop
        if: always()
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force results | Out-Null
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/results/desktop-after-test.png")

      - name: Upload test artifacts (output.xml, log.html, report.html, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results-TC_T1018
          path: results
          if-no-files-found: warn
